name: Build POCO F7 Smooth Zoom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          mkdir source
          unzip -q POCOF7_SmoothZoom_LSPosed_source.zip -d source

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: source
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCOF7-SmoothZoom-APK
          path: source/app/build/outputs/apk/debug/*.apk
